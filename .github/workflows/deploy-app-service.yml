name: Build, Test & Deploy (App Service)

# The API on nqp-api, the Blazor front (through NicolasQuiPaieWeb.Host) on nqp.
on:
  push:
    branches: [main]
  # Pull requests run the build and the tests only: both deployments are for main.
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '11.0.x'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The front is compiled ahead of time in Release (RunAOTCompilation).
      - name: Install the WebAssembly tools
        run: dotnet workload install wasm-tools

      # xUnit v3 (xunit.v3.mtp-off: dotnet test through VSTest), Shouldly and Moq.
      - name: Unit tests
        run: dotnet test src/Tests/NicolasQuiPaie.UnitTests/NicolasQuiPaie.UnitTests.csproj --configuration Release

      # The API on SQLite; the SQL Server tests start their own container (Docker is on the runner, skipped without it).
      - name: Integration tests
        run: dotnet test src/Tests/NicolasQuiPaie.IntegrationTests/NicolasQuiPaie.IntegrationTests.csproj --configuration Release

      # User journeys: the API over HTTP, the Blazor front in Chromium (Playwright), both on loopback ports.
      - name: Build the functional tests
        run: dotnet build src/Tests/NicolasQuiPaie.FunctionalTests/NicolasQuiPaie.FunctionalTests.csproj --configuration Release

      - name: Install Chromium for Playwright
        run: pwsh src/Tests/NicolasQuiPaie.FunctionalTests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

      - name: Functional tests
        run: dotnet test src/Tests/NicolasQuiPaie.FunctionalTests/NicolasQuiPaie.FunctionalTests.csproj --configuration Release --no-build

      - name: Publish the API
        run: dotnet publish src/Back/NicolasQuiPaieAPI/NicolasQuiPaieAPI.csproj --configuration Release --output publish/api

      - name: Publish the front
        run: dotnet publish src/Front/NicolasQuiPaieWeb.Host/NicolasQuiPaieWeb.Host.csproj --configuration Release --output publish/web

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish/api

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: publish/web

  deploy-api:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: api

      # The real connection string lives in the production environment's secrets, never in the repository.
      - name: Set the connection string and turn the demo data on
        env:
          DEFAULT_CONNECTION: ${{ secrets.DEFAULT_CONNECTION }}
        run: |
          if [ -z "$DEFAULT_CONNECTION" ]; then
            echo "::error::Secret DEFAULT_CONNECTION missing in the production environment"
            exit 1
          fi
          # SeedDemoData: this App Service is the demo site, sample proposals are added to an empty platform.
          jq --arg cs "$DEFAULT_CONNECTION" '.ConnectionStrings.DefaultConnection = $cs | .SeedDemoData = true' api/appsettings.json > api/appsettings.json.tmp
          mv api/appsettings.json.tmp api/appsettings.json

      - name: Deploy the API
        uses: azure/webapps-deploy@v3
        with:
          app-name: nqp-api
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: api

  deploy-web:
    runs-on: ubuntu-latest
    # After the API: both apps share one small instance, their containers start better one after the other.
    needs: [build-and-test, deploy-api]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: Deploy the front
        uses: azure/webapps-deploy@v3
        with:
          app-name: nqp
          publish-profile: ${{ secrets.AZURE_WEB_PUBLISH_PROFILE }}
          package: web
